<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: a loop reads layout after every style write, so one frame takes far too long</title>
<body><div id="list"></div>
<script>
EXPECT = { has: ["slow-frame"], allow: ["shift"], message: "in thrash (layout-thrash.html); " };
list.innerHTML = Array.from({ length: 400 }, (_, i) => `<div class="row" style="height:auto;padding:4px">row ${i} with some text that wraps when the row narrows</div>`).join("");
trigger = async () => {
  await frames(2);
  // In a callback of its own, as a scroll or resize handler would run.
  await new Promise((r) =>
    requestAnimationFrame(function thrash() {
      for (let i = 0; i < 600; i++) {
        list.style.width = 300 + (i % 7) * 40 + "px";
        void list.offsetHeight;
      }
      list.style.width = "";
      r();
    })
  );
  await frames(3);
};
</script>
