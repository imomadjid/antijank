<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: a CSS keyframe animation with a gap between two keyframes jumps mid-move</title>
<style>@keyframes slide{0%{transform:translateX(0)}49%{transform:translateX(98px)}50%{transform:translateX(200px)}100%{transform:translateX(300px)}}.go{animation:slide .6s linear forwards}</style>
<body><div class="box" id="card" style="margin:20px"></div>
<script>
EXPECT = { has: ["jump"], animation: /animation slide 600ms linear/ };
trigger = async () => {
  card.classList.add("go");
  await new Promise((r) => card.addEventListener("animationend", r, { once: true }));
};
</script>
