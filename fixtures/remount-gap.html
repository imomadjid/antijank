<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: an identical copy replaces an element, but only after two blank frames</title>
<body><div id="slot" style="margin:20px;height:96px"><div class="box">Card</div></div>
<script>
EXPECT = { has: ["flicker"], message: "remount" };
trigger = async () => {
  await frames(2);
  const old = slot.firstElementChild;
  const c = old.cloneNode(true);
  old.remove();
  await frames(2);
  slot.append(c);
};
</script>
