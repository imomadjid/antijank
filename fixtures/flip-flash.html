<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: FLIP applied a frame late, so the card flashes at its destination</title>
<body><div id="a" style="height:200px;background:#f4f4f4"><div class="box" id="card">Card</div></div><div id="b" style="padding-top:120px"></div>
<script>
EXPECT = { has: ["blip"], allow: ["jump", "reversal", "shift", "overshoot"] };
trigger = async () => {
  const first = card.getBoundingClientRect();
  b.append(card);
  await frames(2); // bug: the new position paints once before the inverse transform is set
  const lastR = card.getBoundingClientRect();
  card.style.transform = `translateY(${first.top - lastR.top}px)`;
  await frame();
  await tween(300, (p) => (card.style.transform = `translateY(${(first.top - lastR.top) * (1 - p)}px)`));
  card.style.transform = "";
};
</script>
