<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: a hover lift runs as the button is clicked; the result still takes 250ms</title>
<style>#btn{margin:160px;transition:transform .3s ease-out}#btn:hover{transform:translateY(-2px)}</style>
<body><button id="btn" class="box">Load</button><div id="out"></div>
<script>
// Away from the corner: the test browser's pointer can rest at (0, 0) and hover it.
EXPECT = { has: ["slow-response"], allow: ["pop-in"] };
btn.addEventListener("click", () => setTimeout(() => (out.innerHTML = '<div class="row">result</div>'), 250));
trigger = async () => {
  btn.click();
  await new Promise((r) => setTimeout(r, 300));
};
</script>
