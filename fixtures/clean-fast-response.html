<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>clean: a click shows a loading label at once, then data arrives 300ms later</title>
<body><button id="btn" class="box">Load</button><div id="out"></div>
<script>
EXPECT = { allow: ["pop-in"] };
btn.addEventListener("click", () => {
  btn.textContent = "Loading…";
  setTimeout(() => {
    btn.textContent = "Load";
    out.innerHTML = '<div class="row">result</div>';
  }, 300);
});
trigger = async () => {
  btn.click();
  await new Promise((r) => setTimeout(r, 350));
};
</script>
