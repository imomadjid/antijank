<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: plain black and yellow boxes appear at full opacity (no text)</title>
<body><div id="list"></div>
<script>
EXPECT = { has: ["pop-in"] };
trigger = () => {
  for (const bg of ["#000", "#ff0"]) {
    const c = document.createElement("div");
    c.style.cssText = `width:160px;height:96px;margin:8px;background:${bg}`;
    list.append(c);
  }
};
</script>
