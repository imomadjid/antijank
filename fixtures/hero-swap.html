<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: thumbnail is swapped for the full card with no crossfade</title>
<body><div id="stage" style="position:relative;margin:20px;height:200px"><div class="box" id="thumb" style="position:absolute;top:0;left:0">Thumb</div></div>
<script>
EXPECT = { has: ["swap"] };
trigger = () => {
  const c = document.createElement("div");
  c.className = "box";
  c.style.cssText = "position:absolute;top:2px;left:2px;background:#2d5be3";
  c.textContent = "Card";
  thumb.replaceWith(c);
};
</script>
