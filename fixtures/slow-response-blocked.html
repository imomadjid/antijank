<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: a click handler blocks the main thread for 160ms before anything shows</title>
<body><button id="btn" class="box">Open</button><div id="out"></div>
<script>
EXPECT = { has: ["slow-response", "slow-frame"], allow: ["pop-in"], cause: /main thread busy/ };
btn.addEventListener("click", () => {
  const t = performance.now();
  while (performance.now() - t < 160) {}
  out.innerHTML = '<div class="row">opened</div>';
});
trigger = async () => {
  // A real click arrives in a frame of its own, not in the one that started recording.
  await frames(2);
  await new Promise((r) => setTimeout(() => (btn.click(), r()), 0));
  await frames(2);
};
</script>
