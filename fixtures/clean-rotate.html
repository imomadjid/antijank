<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>clean: a label rotates a quarter turn (not a stretch)</title>
<body><div id="label" style="margin:120px;width:200px;font-size:20px">Rotating label text</div>
<script>
EXPECT = { none: true };
trigger = () => tween(300, (p) => (label.style.transform = `rotate(${p * 90}deg)`));
</script>
