<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: an element removed and put back later reappears at full opacity</title>
<body><div id="slot" style="margin:20px;height:96px"><div id="card" class="box">Card</div></div>
<script>
EXPECT = { has: ["pop-in", "pop-out"] };
// Expectations must follow the element across its removal.
OPTIONS = { expect: { still: ["#card"], moves: { "#card": { dx: 0, dy: 0 } } } };
trigger = async () => {
  await frames(2);
  const c = card;
  c.remove();
  await frames(12);
  slot.append(c);
};
</script>
