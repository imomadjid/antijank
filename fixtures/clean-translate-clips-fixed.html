<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>clean: a fixed child of a translated overflow:hidden box is clipped by it (translate makes a containing block)</title>
<body><div id="wrap" style="translate:1px 0;overflow:hidden;height:20px;margin:20px">Wrapper</div>
<script>
EXPECT = { none: true };
trigger = () => {
  const c = document.createElement("div");
  c.style.cssText = "position:fixed;top:40px;left:0;width:200px;height:120px;background:#d33";
  wrap.append(c);
};
</script>
