<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>clean: the button is held for 300ms; the result shows as soon as it's released</title>
<body><button id="btn" class="box">Hold</button><div id="out"></div>
<script>
EXPECT = { allow: ["pop-in"] };
btn.addEventListener("click", () => (out.innerHTML = '<div class="row">done</div>'));
trigger = async () => {
  btn.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
  await new Promise((r) => setTimeout(r, 300));
  btn.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));
  btn.click();
  await frames(5);
};
</script>
