<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: an absolute popover inside a static overflow:hidden wrapper pops in (it is not clipped)</title>
<body><div id="wrap" style="height:24px;overflow:hidden;margin:20px">Trigger</div>
<script>
EXPECT = { has: ["pop-in"] };
trigger = () => {
  const c = document.createElement("div");
  c.className = "box";
  c.textContent = "Popover";
  c.style.cssText = "position:absolute;top:80px;left:20px";
  wrap.append(c);
};
</script>
