<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>planted: the root appears after recording starts; later content in it pops in</title>
<body><div id="app"></div>
<script>
EXPECT = { has: ["pop-in"] };
OPTIONS = { root: "#panel" };
trigger = async () => {
  await frames(3);
  const p = document.createElement("section");
  p.id = "panel";
  p.innerHTML = "<div class=\"row\">Already there</div>";
  app.append(p);
  await frames(5);
  const c = document.createElement("div");
  c.className = "box";
  c.textContent = "New";
  p.append(c);
};
</script>
