<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>clean: card fades and slides in</title>
<body><div id="list"></div>
<style>.card{width:240px;height:120px;margin:20px;background:#4a7dff;transition:opacity .25s ease,transform .25s ease}.card.enter{opacity:0;transform:translateY(12px)}</style>
<script>
EXPECT = { none: true };
trigger = async () => {
  const c = document.createElement("div");
  c.className = "card enter";
  list.append(c);
  c.getBoundingClientRect(); // flush the starting style so the transition runs
  c.classList.remove("enter");
};
</script>
