<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px/1.4 system-ui,sans-serif}.box{width:160px;height:96px;background:#4a7dff;color:#fff}.row{height:40px;margin:4px 16px;background:#dde5ff}</style><script src="_lib.js"></script>
<title>clean: a text label added inside an svg (only the svg box is watched)</title>
<body><svg id="chart" width="300" height="120" style="margin:20px;background:#f3f5ff"></svg>
<script>
EXPECT = { none: true };
trigger = () => {
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("x", "20"); t.setAttribute("y", "60"); t.setAttribute("font-size", "40");
  t.textContent = "Label";
  chart.append(t);
};
</script>
