<title>planted: label scales on one axis only</title>
<body><div id="label" style="margin:40px;width:200px;font-size:20px;transform-origin:left">Stretched label text</div>
<script>
EXPECT = { has: ["stretch"] };
trigger = () => tween(300, (p) => (label.style.transform = `scaleX(${0.6 + 0.4 * p})`));
</script>
